name: Bug report
description: Report a reproducible problem in the example application
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include secrets, tenant data, or unredacted analytics payloads. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of commands or interactions that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: sdk-versions
    attributes:
      label: SDK versions
      description: Paste the output of `pnpm sdk:mode`.
      placeholder: "@reopt-ai/data-sdk-client@...; @reopt-ai/data-sdk-server@..."
    validations:
      required: true
  - type: dropdown
    id: sdk-mode
    attributes:
      label: SDK mode
      options:
        - Published npm packages
        - Local reopt-data checkout
        - Fail-open (no credentials)
        - Deployed application
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, pnpm version, browser, and relevant deployment details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add logs, screenshots, or payload excerpts after removing credentials and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this behavior.
          required: true
        - label: This report contains no secrets or personal data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
